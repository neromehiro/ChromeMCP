[project]
name = "chromemcp"
version = "0.6.1"
description = "ChromeMCP: local Chrome automation for OpenCode and MCP clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "websockets>=15,<16"]

[project.urls]
Homepage = "https://github.com/neromehiro/ChromeMCP"

[project.scripts]
chromemcp = "chrome_bridge.cli:main"
chrome-bridge = "chrome_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chrome_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY.md" = "chrome_bridge/assets/THIRD_PARTY.md"
"background.js" = "chrome_bridge/assets/background.js"
"content-scripts/codex.js" = "chrome_bridge/assets/content-scripts/codex.js"
"content-scripts/foreign-frame-monitor.js" = "chrome_bridge/assets/content-scripts/foreign-frame-monitor.js"
"extension-inventory.js" = "chrome_bridge/assets/extension-inventory.js"
"images/cursor-chat.png" = "chrome_bridge/assets/images/cursor-chat.png"
"images/icon128.png" = "chrome_bridge/assets/images/icon128.png"
"manifest.json" = "chrome_bridge/assets/manifest.json"
"package.json" = "chrome_bridge/assets/package.json"
"popup.css" = "chrome_bridge/assets/popup.css"
"popup.html" = "chrome_bridge/assets/popup.html"
"popup.js" = "chrome_bridge/assets/popup.js"
"transport-buffer.js" = "chrome_bridge/assets/transport-buffer.js"
"upstream-adapter.js" = "chrome_bridge/assets/upstream-adapter.js"
"upstream/browser-accessibility.wasm.br" = "chrome_bridge/assets/upstream/browser-accessibility.wasm.br"
"upstream/browser-engine.mjs" = "chrome_bridge/assets/upstream/browser-engine.mjs"
"upstream/engine-worker.mjs" = "chrome_bridge/assets/upstream/engine-worker.mjs"
"upstream/extension-core.js" = "chrome_bridge/assets/upstream/extension-core.js"
"upstream/local-host.mjs" = "chrome_bridge/assets/upstream/local-host.mjs"

[tool.hatch.build.targets.sdist]
include = ["chrome_bridge", "tests", "scripts", "upstream", "content-scripts", "images", "*.js", "*.json", "*.html", "*.css", "*.py", "*.md", "*.toml"]
exclude = ["/.local", "/.runtime", "/.venv", "/node_modules", "/extension", "/dist", "/comparison"]
