[project]
name = "chromemcp"
version = "0.5.3"
description = "Local Chrome extension bridge and Python MCP, independent of Codex App"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "websockets>=15,<16"]

[project.urls]
Homepage = "https://github.com/neromehiro/ChromeMCP"

[project.scripts]
chromemcp = "chrome_bridge.cli:main"
chrome-bridge = "chrome_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chrome_bridge"]
