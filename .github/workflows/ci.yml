name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e . build
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python run_js_tests.py
      - run: python scripts/check_publication.py
      - run: python -m build
      - run: python scripts/check_dist.py
      - name: Verify installed wheel assets
        run: |
          python -m venv /tmp/chromemcp-install
          /tmp/chromemcp-install/bin/pip install dist/*.whl
          cd /tmp
          /tmp/chromemcp-install/bin/chromemcp extension /tmp/chromemcp-extension
          test -f /tmp/chromemcp-extension/upstream/extension-core.js
